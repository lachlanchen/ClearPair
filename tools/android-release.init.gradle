// Signing values come only from the invoking process, never Gradle source files.
gradle.projectsEvaluated {
    allprojects { p ->
        if (p.plugins.hasPlugin('com.android.application')) {
            def env = System.getenv()
            ['CLEARPAIR_KEYSTORE', 'CLEARPAIR_STOREPASS', 'CLEARPAIR_KEYPASS', 'CLEARPAIR_KEYALIAS'].each {
                if (!env[it]) throw new GradleException("Missing signing environment: ${it}")
            }
            def android = p.extensions.getByName('android')
            android.signingConfigs.create('clearpairUpload') {
                storeFile = new File(env.CLEARPAIR_KEYSTORE)
                storePassword = env.CLEARPAIR_STOREPASS
                keyAlias = env.CLEARPAIR_KEYALIAS
                keyPassword = env.CLEARPAIR_KEYPASS
            }
            android.buildTypes.release.signingConfig = android.signingConfigs.clearpairUpload
        }
    }
}
